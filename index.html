<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>MMI Life Savers Check-In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue:#0b4ea2;
      --deep:#071b3a;
      --red:#d71920;
      --white:#ffffff;
      --soft:#eef6ff;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin:0;
      min-height:100vh;
      font-family:Inter, system-ui, sans-serif;
      color:#102033;
      overflow:hidden;
      background:
        radial-gradient(circle at 20% 15%, rgba(215,25,32,.16), transparent 28%),
        radial-gradient(circle at 90% 10%, rgba(11,78,162,.20), transparent 30%),
        linear-gradient(135deg, #ffffff 0%, #eef6ff 42%, #ffffff 100%);
    }
    .bg {
      position:fixed; inset:0; pointer-events:none;
      background:
        linear-gradient(120deg, rgba(11,78,162,.10), transparent 45%),
        repeating-linear-gradient(135deg, rgba(11,78,162,.035) 0 1px, transparent 1px 18px);
    }
    .wrap {
      position:relative;
      min-height:100vh;
      padding:26px 18px 20px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .card {
      width:min(430px, 100%);
      min-height:590px;
      border-radius:34px;
      padding:30px 22px;
      background:rgba(255,255,255,.72);
      border:1px solid rgba(255,255,255,.95);
      box-shadow:0 28px 80px rgba(7,27,58,.22);
      backdrop-filter:blur(18px);
      position:relative;
      overflow:hidden;
    }
    .card::before {
      content:"";
      position:absolute; inset:0 0 auto 0; height:7px;
      background:linear-gradient(90deg, var(--blue), var(--red), var(--blue));
    }
    .badge {
      width:74px; height:74px; border-radius:24px;
      margin:0 auto 20px;
      display:grid; place-items:center;
      background:linear-gradient(135deg, var(--blue), #174f92);
      color:white;
      font-size:34px;
      box-shadow:0 18px 40px rgba(11,78,162,.30);
    }
    h1 {
      min-height:92px;
      margin:0;
      text-align:center;
      font-family:"Playfair Display", serif;
      font-size:clamp(35px, 9vw, 48px);
      line-height:1.02;
      color:var(--deep);
      letter-spacing:-.8px;
      text-shadow:0 0 20px rgba(11,78,162,.12);
    }
    .cursor {
      display:inline-block;
      width:3px;
      height:.9em;
      background:var(--red);
      margin-left:3px;
      vertical-align:-4px;
      animation:blink .8s infinite;
    }
    @keyframes blink { 50% { opacity:0; } }
    .sub {
      margin:18px 0 28px;
      text-align:center;
      color:#334155;
      font-size:17px;
      font-weight:700;
    }
    .inputBox {
      background:white;
      border:1.5px solid rgba(11,78,162,.18);
      border-radius:24px;
      padding:16px;
      box-shadow:0 14px 35px rgba(11,78,162,.10);
    }
    input {
      width:100%;
      border:0;
      outline:0;
      text-align:center;
      font-size:28px;
      font-weight:900;
      letter-spacing:2px;
      color:var(--deep);
      background:transparent;
      padding:8px 4px 14px;
    }
    input::placeholder {
      color:#9aa8bd;
      font-weight:800;
      letter-spacing:.5px;
    }
    button {
      width:100%;
      border:0;
      margin-top:18px;
      padding:18px 20px;
      border-radius:20px;
      color:white;
      font-size:16px;
      font-weight:900;
      letter-spacing:1.4px;
      background:linear-gradient(135deg, var(--blue), #123d78 58%, var(--red));
      box-shadow:0 18px 40px rgba(11,78,162,.30);
      cursor:pointer;
    }
    .hint {
      margin-top:24px;
      text-align:center;
      color:#64748b;
      font-size:13px;
      line-height:1.5;
    }
    .footer {
      position:absolute;
      bottom:13px;
      left:0;
      right:0;
      text-align:center;
      font-size:8px;
      opacity:.16;
      color:#0b4ea2;
      letter-spacing:1px;
      text-shadow:0 0 10px #0b4ea2;
    }
    .overlay {
      position:fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:rgba(4,15,35,.70);
      backdrop-filter:blur(12px);
      z-index:20;
    }
    .overlay.show { display:flex; }
    .modal {
      width:min(430px, 100%);
      border-radius:34px;
      padding:34px 24px;
      text-align:center;
      color:white;
      transform:scale(.94);
      animation:pop .25s ease forwards;
      border:1px solid rgba(255,255,255,.22);
      box-shadow:0 32px 90px rgba(0,0,0,.38);
    }
    @keyframes pop { to { transform:scale(1); } }
    .welcome { background:linear-gradient(135deg, #0b4ea2, #0c2e63 66%, #ffffff22); }
    .repeat { background:linear-gradient(135deg, #0b4ea2, #0c2e63 55%, #d71920); }
    .invalid { background:linear-gradient(135deg, #d71920, #7b0d12); }
    .modal .big {
      font-size:42px;
      font-weight:1000;
      letter-spacing:1px;
      margin-bottom:12px;
    }
    .modal .name {
      font-family:"Playfair Display", serif;
      font-size:35px;
      line-height:1.1;
      font-weight:800;
    }
    .modal .tap {
      margin-top:24px;
      font-size:13px;
      opacity:.86;
      font-weight:700;
    }
  </style>
</head>

    const nurseMap = new Map(NURSES.map(n => [String(n.id).trim(), n.name]));

    const typedEl = document.getElementById("typed");
    const titleText = "Welcoming Our Life Savers";
    let i = 0;
    function typeTitle() {
      if (i <= titleText.length) {
        typedEl.textContent = titleText.slice(0, i);
        i++;
        setTimeout(typeTitle, 72);
      }
    }
    typeTitle();

    const form = document.getElementById("checkinForm");
    const input = document.getElementById("employeeId");
    const overlay = document.getElementById("overlay");
    const modal = document.getElementById("modal");
    const modalBig = document.getElementById("modalBig");
    const modalName = document.getElementById("modalName");

    function showMessage(type, big, name = "") {
      modal.className = "modal " + type;
      modalBig.textContent = big;
      modalName.textContent = name;
      overlay.classList.add("show");
    }

    overlay.addEventListener("click", () => {
      overlay.classList.remove("show");
      input.value = "";
      setTimeout(() => input.focus(), 150);
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const employeeId = input.value.trim();
      if (!employeeId) return;

      const nurseName = nurseMap.get(employeeId);

      try {
        if (!nurseName) {
          await addDoc(collection(db, "attempts"), {
            employeeId,
            nurseName: "",
            status: "INVALID ID",
            attemptTime: serverTimestamp(),
            source: "index.html"
          });
          showMessage("invalid", "INVALID ID!");
          return;
        }

        const checkinRef = doc(db, "checkins", employeeId);
        const existing = await getDoc(checkinRef);

        if (existing.exists()) {
          await updateDoc(checkinRef, {
            lastAttemptAt: serverTimestamp(),
            repeatCount: increment(1),
            status: "SIGNED IN AGAIN"
          });

          await addDoc(collection(db, "attempts"), {
            employeeId,
            nurseName,
            status: "SIGNED IN AGAIN",
            attemptTime: serverTimestamp(),
            source: "index.html"
          });

          showMessage("repeat", "ALREADY SIGNED IN!", nurseName);
          return;
        }

        await setDoc(checkinRef, {
          employeeId,
          nurseName,
          status: "SIGNED IN",
          firstCheckInAt: serverTimestamp(),
          lastAttemptAt: serverTimestamp(),
          repeatCount: 0
        });

        await addDoc(collection(db, "attempts"), {
          employeeId,
          nurseName,
          status: "SIGNED IN",
          attemptTime: serverTimestamp(),
          source: "index.html"
        });

        showMessage("welcome", "WELCOME", nurseName);

      } catch (err) {
        console.error(err);
        showMessage("invalid", "CONNECTION ERROR", "Please try again");
      }
    });

    window.addEventListener("load", () => input.focus());
  </script>
